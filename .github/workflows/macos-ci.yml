name: macOS CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Swift tests
        run: swift test --no-parallel
      - name: Warning-as-error release build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Release-tool tests
        run: python3 -B -m unittest discover -s Tests/ReleaseToolsTests -v
      - name: Release metadata
        run: python3 -B scripts/verify-release-metadata.py
      - name: Repository privacy and history scan
        run: python3 -B scripts/verify-repository-tree.py --history
      - name: Whitespace check
        run: git diff --check
